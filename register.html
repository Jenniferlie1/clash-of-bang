<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of BaNG - Register</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/register.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1 class="logo">CLASH OF BaNG</h1>
            
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <ul class="nav-links" id="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="troops.html">Troops</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="register.html" class="active-link">Register</a></li>
            </ul>
            <div class="nav-actions" id="nav-actions">
                <button class="join-btn" onclick="window.location.href='register.html'">Join Guild</button>
                <span class="icon">&#128276;</span> 
                <span class="icon">&#128100;</span> 
            </div>
        </nav>
    </header>

    <main class="register-section">
        <div class="register-container">
            <h2>Join Our Community</h2>
            
            <form id="registerForm" action="#" method="POST">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <div class="input-with-icon">
                            <span>&#128100;</span>
                            <input type="text" id="name" placeholder="Enter your name" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-with-icon">
                            <span>&#9993;</span>
                            <input type="email" id="email" placeholder="you@gmail.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <div class="input-with-icon">
                            <span>&#8987;</span>
                            <input type="number" id="age" placeholder="e.g. 18" min="1" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="troop">Favorite Troop</label>
                        <div class="input-with-icon">
                            <span>&#9876;</span>
                            <input type="text" id="troop" placeholder="Enter your favorite troop" required>
                        </div>
                    </div>
                </div>

                <div class="form-group gender-group">
                    <label>Gender</label>
                    <div class="radio-options">
                        <label class="radio-label">
                            <input type="radio" name="gender" value="male" required> Male
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="female"> Female
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="other"> Other
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gender" value="hidden"> Keep Hidden
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reason">Why Do You Wish To Join?</label>
                    <textarea id="reason" placeholder="Enter your reason here..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <span>&#128737;</span> Register
                </button>

                <p class="login-link">Already have an account? <a href="#">Sign In</a></p>
            </form>
        </div>
    </main>

        <p>&copy; 2026. All rights reserved. Protected under international copyright law.</p>

        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
